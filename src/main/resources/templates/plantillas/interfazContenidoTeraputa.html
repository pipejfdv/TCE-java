<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Terapeuta</title>
</head>
<body>

<div class="cotainer" th:fragment="inicioTerapeuta">
  <div class="content" style="background: rgba(246, 247, 251, 0.63); border-radius: 15px;">
      <h1 class="mt-2 mb-2 d-flex justify-content-center">Articulos de tu interés</h1>

        <div id="carouselExampleCaptions" class="carousel slide full-width-carousel m-2">
            <div class="carousel-inner">
                <!-- Itera sobre la lista de noticias y muestra cada noticia -->
                <div class="carousel-item" th:each="noticia, iterStat : ${listaNoticias}" th:classappend="${iterStat.index == 0 ? 'active' : ''}">

                    <div class="card mx-auto card-centered" style="width: 50%; max-width: 600px;">

                        <img th:src="${noticia.image}" class="card-img-top" alt="imagen de noticia">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${noticia.title}">Título</h5>

                            <p><strong>Fuente:</strong> <span th:text="${noticia.source}">Fuente</span></p>
                            <p><strong>País:</strong> <span th:text="${noticia.country}">País</span></p>
                            <!--el rel evita que tenga acceso a ventana actual -->
                            <a th:href="${noticia.url}" rel="noopener noreferrer" target="_blank" class="btn btn-primary">Leer más</a>
                        </div>

                    </div>
                </div>

            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
      <table class="table table-info table-striped table-hover table-responsive">
          <thead>
          <tr>
              <th scope="col">#</th>
              <th scope="col">P. nombre</th>
              <th scope="col">S. nombre</th>
              <th scope="col">P. apellido</th>
              <th scope="col">S. apellido</th>
              <th scope="col">Año nacimiento</th>
              <th scope="col">Edad</th>
              <th scope="col">Correo</th>
              <th scope="col">Opciones</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="user, iterador : ${listaUsuarios}">
              <th scope="row" th:text="${iterador.index + 1}">1</th>
              <td th:text="${user.primer_nombre}"></td>
              <td th:text="${user.segundo_nombre}"></td>
              <td th:text="${user.primer_apellido}"></td>
              <td th:text="${user.segundo_apellido}"></td>
              <td th:text="${user.fecha_nacimiento}"></td>
              <td th:text="${user.getAge()}"></td>
              <td th:text="${user.correo}"></td>
              <td th:text="${user.correo}"></td>
          </tr>
          </tbody>
      </table>

  </div>
</div>

</body>
</html>
